<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RobotDx</title>
<link rel="icon" href="data:,">
<script>
  // Before the first paint: the stored skin and light/dark (app.js keeps them in step afterwards; docs/round2-seams.md).
  (function () {
    var html = document.documentElement, skin = null, mode = null;
    try { skin = localStorage.getItem('io-diagnostics.skin'); mode = localStorage.getItem('io-diagnostics.mode'); } catch (_) {}
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    html.dataset.skin = skin || 'shadcn';
    html.dataset.mode = mode === 'light' || mode === 'dark' ? mode : (dark ? 'dark' : 'light');
  })();
</script>
<!-- tokens first, then the default skin (other skins load from skins/index.json), then the page and the tree styles -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="skins/shadcn.css" data-skin-css="shadcn">
<link rel="stylesheet" href="app.css">
<!-- the terminal emulator the runs panel uses (xterm.js, vendored: the page is served offline; vendor/xterm/NOTICE.md) -->
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<!-- The tree styles (window.IOTreeRenderers); the bottom-right cluster switches them live. Linking every stylesheet
     here keeps the renderers from injecting their own (each class family is prefixed: t1-, t2-, v3-, v4-, v5-, t6-,
     so they cannot touch each other's rows). -->
<link rel="stylesheet" href="tree/v1.css">
<link rel="stylesheet" href="tree/v2.css">
<link rel="stylesheet" href="tree/v3.css">
<link rel="stylesheet" href="tree/v4.css">
<link rel="stylesheet" href="tree/v5.css">
<link rel="stylesheet" href="tree/v6.css">
<!-- the Activity view (activity/log.js): its own styles, tokens only -->
<link rel="stylesheet" href="activity/log.css">
<!-- the 3D view (threed/core.js): its styles; its scene (threed/scene.js) is a module loaded through this importmap only when the view
     opens (three.js and urdf-loader, vendored: vendor/three/NOTICE.md) -->
<link rel="stylesheet" href="threed/threed.css">
<script type="importmap">{"imports": {"three": "./vendor/three/build/three.module.js", "three/examples/jsm/": "./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="i-motor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></symbol>

    <symbol id="i-hid" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M8 13h.01M12 13h.01M16 13h.01M7 16h10"/></symbol>

    <symbol id="i-pci" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="10" rx="1.5"/><path d="M6 16v3M9 16v3M12 16v3M15 16v3M18 16v3M7 10h4"/></symbol>
    <symbol id="i-net" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-3h14v3"/></symbol>
    <symbol id="i-tty" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m6 9 3 3-3 3M11 15h5"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></symbol>
    <symbol id="i-group" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="2"/></symbol>

    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3ZM12 13v7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 2.5 8.5 4.75v9.5L12 21.5l-8.5-4.75v-9.5Z"/><path d="m3.5 7.25 8.5 4.75 8.5-4.75M12 12v9.5"/></symbol>

<header class="topbar">
  <div class="tb-left">Activities</div>
  <div class="tb-clock" id="clock">—</div>
  <div class="tb-right">
    <button class="chip" id="chip" title="RobotDx (top-bar chip)"><svg class="ic"><use href="#i-io"/></svg><span id="chip-label">IO</span><span class="chip-caret">▾</span></button>
    <span class="tb-sys"><svg class="ic"><use href="#i-hub"/></svg>⏻</span>
  </div>
  <div class="chip-pop" id="chip-pop" hidden></div>
</header>

<main class="window">
  <div class="toolbar">
    <div class="seg" id="views">
      <button data-view="tree">Tree</button><button data-view="table">Table</button><button data-view="activity">Activity</button>
    </div>
    <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="search" placeholder="Search entities, ids, ports…" autocomplete="off"></label>
    <!-- View options (round 3): one sliders button beside the search box, one popover (Claude Transcripts' filter panel) -->
    <div class="vo-wrap">
      <button class="vo-btn" id="vo-btn" title="View options: group, sort, style" aria-haspopup="dialog" aria-expanded="false" aria-controls="view-options"><svg class="ic"><use href="#i-sliders"/></svg></button>
      <div class="vo-pop" id="view-options" role="dialog" aria-label="View options" hidden>
        <label class="vo-row" id="structure-switch" title="Group by: what the rows are"><span class="vo-label">Group by</span><select id="structure" aria-label="Group by"></select></label>
        <label class="vo-row" title="Sort by"><span class="vo-label">Sort by</span><select id="sort" aria-label="Sort by">
          <option value="status">Status</option><option value="name">Name</option><option value="change">Last change</option>
        </select></label>
        <div class="vo-toggles" id="structure-toggles"></div>
        <div class="vo-sep"></div>
        <label class="vo-row" id="variant-switch" title="Tree style"><span class="vo-label">Tree style</span><select id="tree-variant" aria-label="Tree style"></select></label>
        <label class="vo-row" id="window-switch" title="History window" hidden><span class="vo-label">History</span><select id="history-window" aria-label="History window"></select></label>
        <label class="vo-row" id="depthmap-switch" title="Depth colour map: how the live depth picture of a camera is coloured (realsense-viewer's colour schemes); a camera streaming now restarts its stream to use it" hidden><span class="vo-label">Depth colour map</span><select id="depth-colormap" aria-label="Depth colour map"></select></label>
        <label class="vo-row vo-switch" id="depth-equalize-switch" title="Histogram equalization: spread the colours over the distances the picture actually holds. Off: the colours span the range below" hidden><span class="vo-label">Depth equalization</span><input type="checkbox" role="switch" id="depth-equalize" aria-label="Depth histogram equalization"></label>
        <div class="vo-row" id="depth-range-switch" title="With equalization off, the colours span this distance range" hidden><span class="vo-label">Depth range</span>
          <span class="vo-range"><input type="number" id="depth-min" min="0" max="16" step="0.1" aria-label="Depth range minimum, metres"><span class="vo-unit">to</span><input type="number" id="depth-max" min="0" max="16" step="0.1" aria-label="Depth range maximum, metres"><span class="vo-unit">m</span></span>
        </div>
        <!-- Sidebar (L1's ribbon style): shown while L1 is the layout; layouts/l1.js owns it. WHY Zach, 2026-10-26: "show it with the text and without text. or with the icon and text center (figma style) ... similar to how shopify does it" -->
        <label class="vo-row" id="sidebar-switch" title="Sidebar: icons only, each icon with its label under it (Figma), or a wide list of icon and label rows (Shopify)" hidden><span class="vo-label">Sidebar</span><select id="sidebar-style" aria-label="Sidebar"></select></label>
        <label class="vo-row" id="skin-switch" title="Skin"><span class="vo-label">Skin</span><select id="skin" aria-label="Skin"></select></label>
        <div class="vo-row"><span class="vo-label">Mode</span>
          <div class="ctl-seg" id="mode-switch" role="radiogroup" aria-label="Light or dark">
            <button data-mode="auto" role="radio">Auto</button><button data-mode="light" role="radio">Light</button><button data-mode="dark" role="radio">Dark</button>
          </div>
        </div>
      </div>
    </div>
    <!-- the Table's inspector: folded until a row is clicked; this pins it open (`]`) -->
    <button class="vo-btn" id="insp-toggle" title="Pin the inspector open ( ] )" aria-pressed="false" hidden><svg class="ic"><use href="#i-panel"/></svg></button>
    <div class="spacer"></div>
    <span class="tb-label" id="mode">—</span>
  </div>
  <!-- a host source the tree could not use (io_facts.usb, …): shown only when one is skipped -->
  <div class="sourceline" id="sources" hidden></div>
  <div class="main" id="main">
    <section class="left" id="left">
      <!-- one persistent pane per tree proposal: a renderer keeps its expansion and scroll in its own pane -->
      <div id="tree-host"></div>
      <div id="left-other" hidden></div>
      <!-- the Activity log keeps its own DOM (its search box, scroll and pause survive the page's once-a-second render) -->
      <div id="activity-host" hidden></div>
    </section>
    <!-- the pane boundary: drag to resize (remembered), double-click for the default, arrow keys when focused -->
    <div class="sash" id="sash" role="separator" aria-orientation="vertical" aria-label="Resize the panes" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <aside class="inspector" id="inspector">
      <div class="insp-bar"><span class="insp-name">Inspector</span>
        <button class="insp-btn" id="insp-pin" title="Keep the inspector open ( ] )" aria-pressed="false"><svg class="ic"><use href="#i-pin"/></svg></button>
        <button class="insp-btn" id="insp-close" title="Fold the inspector away (Esc)"><svg class="ic"><use href="#i-close"/></svg></button>
      </div>
      <div class="detail" id="detail"></div>
    </aside>
    <!-- the 3D view (threed/core.js): drawn here, where the entity page sits, while view=threed -->
    <section class="threed" id="threed-host" hidden></section>
  </div>
  <!-- the run view's panel (runs/*.js, docs/runs-v1.md section 7): hidden until a view uses it -->
  <div id="runs-root" hidden></div>
  <footer class="statusbar">
    <span id="lastmsg">—</span>
    <span class="sb-note">diagnoses passively · a utility runs only after its dry run and your click</span>
    <!-- The skin, at the bottom too (round 3.5: Zach, "please still give me the option to change the skin at the bottom"),
         then the TEMPORARY Prototype picker (never a URL flag): the detail layout and the utility menu, live, remembered.
         Everything else lives in View options. -->
    <span id="runs-status"></span>
    <div class="controls" id="controls">
      <!-- the page layout (layouts/*.js): five proposals for where navigation, search, views and the log live -->
      <div class="ctl" id="layout-switch" title="Layout: switch the page layout (L1 Obsidian, L2 VS Code, L3 Claude, L4 Notion, L5 System Monitor)">
        <span class="ctl-label">Layout</span>
        <select id="layout-pick" aria-label="Layout"></select>
      </div>
      <div class="ctl" id="skin-bar-switch" title="Skin: every skin (View options has the same list)">
        <span class="ctl-label">Skin</span>
        <select id="skin-bar" aria-label="Skin (bottom bar)"></select>
      </div>
      <div class="ctl" id="proto-switch" title="Prototype: switch the detail layout and the utility menu">
        <span class="ctl-label">Prototype</span>
        <select id="detail-layout" aria-label="Detail layout" title="Detail layout"></select>
        <select id="utility-menu" aria-label="Utility menu" title="Utility menu"></select>
        <select id="run-view" aria-label="Runs view" title="Runs view"></select>
        <select id="chart-view" aria-label="Chart view" title="Chart view"></select>
      </div>
    </div>
  </footer>
</main>

<div class="modal-back" id="modal" hidden></div>

<script src="runs/core.js"></script>
<script src="activity/core.js"></script>
<script src="activity/log.js"></script>
<script src="usb.js"></script>
<script src="charts/core.js"></script>
<script src="detail/d6-rows.js"></script>
<script src="view/core.js"></script>
<script src="view/composites.js"></script>
<script src="summary.js"></script>
<script src="visibility.js"></script>
<script src="tree/v1.js"></script>
<script src="tree/v2.js"></script>
<script src="tree/v3.js"></script>
<script src="tree/v4.js"></script>
<script src="tree/v5.js"></script>
<script src="tree/v6.js"></script>
<script src="layouts/palette.js"></script>
<script src="layouts/host.js"></script>
<script src="threed/core.js"></script>
<script src="app.js"></script>
</body>
</html>
