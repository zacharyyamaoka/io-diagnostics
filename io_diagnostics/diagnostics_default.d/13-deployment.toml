# Rack / deployment (composite): the installed machine
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 7 bound here (live: consumers robotdx or both)

[[part]]
type = "deployment"
composite = ["rack", "deployment", "cell"]

# motors x gates (T1-T8): the roll-up of every hard gate
# from: his (Sources/Daily Notes/Daily Note - Oct 25 2026.md:48); limits: none
[[diagnostic]]
id = "rack.gate_matrix"
diagnostic = "stock.gate_matrix"
title = "hard gates passing"
part = "deployment"
window_s = 60
[diagnostic.config]
title = "hard gates"
gates = ["T1", "T2", "T3", "T4", "T5", "T6", "T7", "T8"]

# the composite's own verdict; caused_by names the station
# from: his (World Model/Chunks & Concepts/C - Diagnostics Record (What We Learned Since ROS DiagnosticStatus).md (Zach in chat, 2026-10-22)); limits: his (acceptance rig: tolerate_fail 0)
[[diagnostic]]
id = "rack.rollup"
diagnostic = "stock.rollup"
title = "rack status"
part = "deployment"
window_s = 60
[diagnostic.config]
title = "rack"

# each gate's newest evidence is inside its validity window
# from: proposed (Diagnostics Rollups note (2026-10-23) P3); limits: proposed (Diagnostics Rollups note P3)
[[diagnostic]]
id = "rack.evidence_age"
diagnostic = "stock.staleness"
title = "evidence freshness"
part = "deployment"
window_s = 60

# hours between system faults; uptime chart
# from: his (Sources/Daily Notes/Daily Note - Oct 24 2026.md:222); limits: his (Sources/Notes/BAM KPIs.md:62 (System MTTF 10,000 hrs))
[[diagnostic]]
id = "rack.uptime"
diagnostic = "stock.event_interval"
title = "uptime and MTTF"
part = "deployment"
window_s = 60
[diagnostic.config]
codes = ["system_fault"]
limits = { error_low = 10000.0 }

# material processed per hour with no pile-up
# from: his (Maps & Views/Questions/Q - What metrics (kpis) to track for BAM？ and how to track in simulator？.md:97); limits: his (Sources/Notes/BAM KPIs.md:61 (Throughput 1 ton/hr))
[[diagnostic]]
id = "rack.throughput"
diagnostic = "stock.sample_rate"
title = "throughput"
part = "deployment"
window_s = 60
[diagnostic.config]
expected_hz = 0.0002777777777777778

# cpu, memory, disk, temperature, clock of the host
# from: his (Sources/Daily Notes/Daily Note - Oct 22 2026.md:427); limits: proposed (ROS diagnostic_common_diagnostics CPU temperature defaults)
[[diagnostic]]
id = "rack.host"
diagnostic = "stock.box"
title = "the computer"
part = "deployment"
window_s = 60
[diagnostic.config]
channel = "cpu_temp_c"
max = { warn_high = 85.0, error_high = 95.0 }

# USB link speed, re-enumerations, CAN reply loss per adapter
# from: his (Sources/Daily Notes/Daily Note - Oct 22 2026.md:427); limits: his code (his transport_error_count CounterTask warn 3 / error 10)
[[diagnostic]]
id = "rack.links"
diagnostic = "stock.share"
title = "link health"
part = "deployment"
window_s = 60
[diagnostic.config]
better = "lower"
statistic = "count"
unit = "count"
limits = { warn_high = 3.0, error_high = 10.0 }
