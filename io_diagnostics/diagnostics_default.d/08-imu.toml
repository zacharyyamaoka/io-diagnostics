# IMU
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 3 bound here (live: consumers robotdx or both); sim2real-only, not bound: imu.allan

[[part]]
type = "imu"
model_id = ["*-imu*", "bosch-bno0*"]
composite = ["imu"]

# gyro and accel offsets at rest, and their drift with temperature
# from: proposed (Kalibr IMU noise model); limits: none (mean and std limits from the datasheet)
[[diagnostic]]
id = "imu.static_bias"
diagnostic = "stock.box"
title = "static bias"
part = "imu"
window_s = 60
[diagnostic.config]
channel = "gyro_rad_s"
unit = "rad/s"
headline = "mean"

# |a| at rest equals g: the cheapest truthfulness check
# from: proposed (IEEE 1293 accelerometer test practice (snippet)); limits: proposed (reference 9.80665 m/s2, +-1 %)
[[diagnostic]]
id = "imu.gravity"
diagnostic = "stock.agreement"
title = "gravity norm at rest"
part = "imu"
window_s = 60
[diagnostic.config]
limits = { error_low = -1.0, error_high = 1.0 }

# samples at the configured rate
# from: proposed (ROS diagnostic_updater); limits: proposed (set expected_hz to the IMU's configured rate)
[[diagnostic]]
id = "imu.rate"
diagnostic = "stock.sample_rate"
title = "sample rate"
part = "imu"
window_s = 60
[diagnostic.config]
expected_hz = 200.0
