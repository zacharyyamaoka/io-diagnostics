# Camera, RGBD (D405 / D435): everything RGB has, plus depth
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 4 bound here (live: consumers robotdx or both); sim2real-only, not bound: depth.z_accuracy, depth.cloud_vs_sim

[[part]]
type = "camera_rgbd"
model_id = ["intel-realsense-d4*", "realsense-d4*"]
composite = ["rgbd_camera"]

# spatial noise about a fitted plane
# from: proposed (NIST depth camera image quality slides (nist.gov)); limits: proposed
[[diagnostic]]
id = "depth.plane_rms"
diagnostic = "stock.depth_plane"
title = "plane-fit RMS"
part = "camera_rgbd"
window_s = 60
[diagnostic.config]
plane_rms = { warn_high = 0.4, error_high = 1.0 }

# share of ROI pixels with valid depth
# from: proposed (NIST depth camera image quality slides); limits: proposed
[[diagnostic]]
id = "depth.fill_rate"
diagnostic = "stock.depth_plane"
title = "fill rate"
part = "camera_rgbd"
window_s = 60
[diagnostic.config]
headline = "fill_rate"
fill_rate = { warn_low = 99.0, error_low = 98.0 }

# per-pixel std over 40 frames
# from: proposed (NIST slides; librealsense depth-quality tool); limits: proposed
[[diagnostic]]
id = "depth.temporal_noise"
diagnostic = "stock.depth_plane"
title = "temporal noise"
part = "camera_rgbd"
window_s = 60
[diagnostic.config]
headline = "temporal_noise"
temporal_noise = { warn_high = 0.2, error_high = 0.5 }

# RealSense self-calibration score
# from: proposed (RealSense BKM for D400 over lifetime rev 1.31); limits: proposed (RealSense BKM: <= 0.25 ok, >= 0.75 recalibrate (reference 0))
[[diagnostic]]
id = "depth.health_check"
diagnostic = "stock.agreement"
title = "on-chip calibration health"
part = "camera_rgbd"
window_s = 60
[diagnostic.config]
mode = "difference"
unit = "1"
limits = { warn_high = 0.25, error_high = 0.75 }
