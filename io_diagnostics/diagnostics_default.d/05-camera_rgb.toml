# Camera, RGB
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 5 bound here (live: consumers robotdx or both); sim2real-only, not bound: camera.intrinsics, camera.sim_overlay

[[part]]
type = "camera_rgb"
model_id = ["intel-realsense-d4*", "realsense-d4*", "obsbot-*", "logitech-*", "*-uvc-camera*"]
composite = ["camera"]

# frames arrive at the configured fps without gaps
# from: proposed (ROS diagnostic_updater update_functions.hpp; greenwave_monitor); limits: proposed (ROS FrequencyStatus; 30 fps and hardware ms stamps (RealSense hw_ms) until the stream says)
[[diagnostic]]
id = "camera.frame_rate"
diagnostic = "stock.sample_rate"
title = "frame rate and drops"
part = "camera_rgb"
window_s = 60
[diagnostic.config]
expected_hz = 30.0
stamps_scale = 0.001

# frames are not late or from the future
# from: proposed (ROS diagnostic_updater update_functions.hpp); limits: proposed (ROS TimeStampStatusParam)
[[diagnostic]]
id = "camera.latency"
diagnostic = "stock.stamp_delay"
title = "timestamp delay"
part = "camera_rgb"
window_s = 60

# a fixed tag stays where calibration put it
# from: his (Sources/Apple Notes/How long before I can actually get a robot moving (APPLE NOTE).md:78); limits: proposed (io-diagnostics saw a 28 px camera move (Oct 21); set tag_id to the rack's fixed tag)
[[diagnostic]]
id = "camera.extrinsic_drift"
diagnostic = "stock.marker_drift"
title = "extrinsic drift"
part = "camera_rgb"
window_s = 60
[diagnostic.config]
limits = { warn_high = 3.0, error_high = 10.0 }

# frames stay sharp enough to detect tags while the arm moves
# from: his (Sources/Notion Import/Notebook & Private Up to Import/One Dof Robot Studies.md:22); limits: none (site-calibrated on labelled frames: a reading until calibrated)
[[diagnostic]]
id = "camera.blur"
diagnostic = "stock.image_sharpness"
title = "blur during motion"
part = "camera_rgb"
window_s = 60

# share of frames where the tag is found (by speed band)
# from: his (Sources/Notion Import/Notebook & Private Up to Import/One Dof Robot Studies.md:22); limits: none
[[diagnostic]]
id = "camera.tag_detect"
diagnostic = "stock.share"
title = "tag detection rate"
part = "camera_rgb"
window_s = 60
[diagnostic.config]
slice_by = "speed_band"
