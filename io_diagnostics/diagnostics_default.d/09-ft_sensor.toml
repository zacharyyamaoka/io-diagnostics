# Force/torque sensor, load cell
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 4 bound here (live: consumers robotdx or both)

[[part]]
type = "ft_sensor"
model_id = ["ati-*", "*-load-cell*", "*-ft-sensor*"]
composite = ["ft_sensor", "load_cell"]

# a mass >= 20 % of full scale reads as itself
# from: proposed (ATI FT_FAQ.pdf); limits: proposed (ATI known-mass check; the servo T6 bounds, borrowed)
[[diagnostic]]
id = "ft.known_mass"
diagnostic = "stock.known_load_gain"
title = "known-mass check"
part = "ft_sensor"
window_s = 60

# the unloaded reading after bias, over time
# from: proposed (ATI FT_FAQ.pdf); limits: none (mean limits from the sensor's datasheet)
[[diagnostic]]
id = "ft.zero_drift"
diagnostic = "stock.box"
title = "zero drift"
part = "ft_sensor"
window_s = 60
[diagnostic.config]
channel = "force_n"
unit = "N"
headline = "mean"

# std of each axis unloaded
# from: proposed (ATI FT_FAQ.pdf); limits: none (std limits per axis from the datasheet)
[[diagnostic]]
id = "ft.noise"
diagnostic = "stock.box"
title = "noise at rest"
part = "ft_sensor"
window_s = 60
[diagnostic.config]
channel = "force_n"
unit = "N"
headline = "std"

# any axis out of range invalidates the rows
# from: proposed (ATI FT_FAQ.pdf); limits: proposed (status Error bit as a fault code)
[[diagnostic]]
id = "ft.saturation"
diagnostic = "stock.fault_codes"
title = "saturation flag"
part = "ft_sensor"
window_s = 60
