# Gripper / claw
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 5 bound here (live: consumers robotdx or both); sim2real-only, not bound: gripper.repeat

[[part]]
type = "gripper"
model_id = ["robotiq-2f-*", "*-gripper*"]
composite = ["gripper", "claw"]

# the gripper opens, closes and follows its width trajectory
# from: his (Projects/BAM Robotics/BAM/FRDPARRC/DP Waste/Sorting Machine/MRF-in-a-box/Arm Control/bam_core/Acceptance Tests.md:30); limits: none
[[diagnostic]]
id = "gripper.cycle"
diagnostic = "stock.tracking_error"
title = "open / close / follow"
part = "gripper"
window_s = 60
[diagnostic.config]
statistic = "final"
channel = "width_mm"
scale = 1.0
unit = "mm"

# the 'object inside' signal agrees with ground truth
# from: his (Projects/BAM Robotics/BAM/FRDPARRC/DP Waste/Sorting Machine/MRF-in-a-box/Arm Control/bam_core/Acceptance Tests.md:30); limits: proposed
[[diagnostic]]
id = "gripper.detect"
diagnostic = "stock.share"
title = "object-inside truthfulness"
part = "gripper"
window_s = 60
[diagnostic.config]
limits = { error_low = 0.8 }

# share of grasps that hold, sliced by object type and environment
# from: his (Sources/Daily Notes/Daily Note - Oct 14 2026.md:683); limits: his (Sources/Notes/BAM KPIs.md:73 (Grasping: Probability of Success 20 %))
[[diagnostic]]
id = "gripper.grasp_success"
diagnostic = "stock.share"
title = "grasp success rate"
part = "gripper"
window_s = 60
[diagnostic.config]
slice_by = "class"
limits = { error_low = 0.2 }

# time to choose a grasp
# from: his (Sources/Daily Notes/Daily Note - Oct 14 2026.md:685); limits: his (Sources/Notes/BAM KPIs.md:75 (Computation time 1 s))
[[diagnostic]]
id = "gripper.compute_time"
diagnostic = "stock.box"
title = "grasp computation time"
part = "gripper"
window_s = 60
[diagnostic.config]
channel = "compute_s"
unit = "s"
max = { error_high = 1.0 }

# measured force vs commanded
# from: proposed (Schunk EGI datasheet (snippet)); limits: none
[[diagnostic]]
id = "gripper.force"
diagnostic = "stock.tracking_error"
title = "grip force tracking"
part = "gripper"
window_s = 60
[diagnostic.config]
channel = "force_n"
scale = 1.0
unit = "N"
