# Encoder (rotor magnetic encoder; output encoder)
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 3 bound here (live: consumers robotdx or both); sim2real-only, not bound: encoder.output_agreement

[[part]]
type = "encoder"
model_id = ["*as5047*", "*-encoder*"]
composite = ["encoder"]

# the zero found by N homings, spread
# from: his (Sources/Apple Notes/How long before I can actually get a robot moving (APPLE NOTE).md:76); limits: none
[[diagnostic]]
id = "encoder.homing"
diagnostic = "stock.repeatability_floor"
title = "homing repeatability"
part = "encoder"
window_s = 60
[diagnostic.config]
relative_to_target = false

# RMS of q at rest (std over a still window)
# from: proposed (AS5047D datasheet (sparkfun AS5047D_datasheet.pdf)); limits: proposed (AS5047D datasheet 0.068 deg RMS)
[[diagnostic]]
id = "encoder.standstill_noise"
diagnostic = "stock.box"
title = "standstill noise"
part = "encoder"
window_s = 60
[diagnostic.config]
channel = "q_rad"
unit = "rad"
std = { error_high = 0.001186823891356144 }
headline = "std"

# encoder-validity bits, magnet too weak / strong, CORDIC overflow
# from: proposed (AS5047D datasheet; ODrive docs fibre_types); limits: proposed (moteus fault table; replace with the encoder's own code table)
[[diagnostic]]
id = "encoder.validity"
diagnostic = "stock.fault_codes"
title = "validity and field flags"
part = "encoder"
window_s = 60
