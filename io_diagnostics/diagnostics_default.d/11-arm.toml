# Robot arm, 2 to 7+ DOF (five-bar included)
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 7 bound here (live: consumers robotdx or both); sim2real-only, not bound: arm.pose_ap_rp, arm.sim_vs_real, arm.workspace_coverage, arm.closure

[[part]]
type = "arm"
model_id = ["universal-robots-ur*"]
composite = ["arm"]

# the tool's position error at every stop, in mm, the arm gate
# from: his (Sources/Daily Notes/Daily Note - Oct 21 2026.md:24); limits: his (Aruco Challenges: 'within 5mm should be ok for grasping')
[[diagnostic]]
id = "arm.tool_error_at_stop"
diagnostic = "stock.stop_error"
title = "tool error at stop"
part = "arm"
window_s = 60
[diagnostic.config]
side = "output"
scale = 1.0
unit = "mm"
limits = { error_high = 5.0 }

# Cartesian and joint error along the path, coloured on it
# from: his (Sources/Daily Notes/Daily Note - Oct 28 2026.md:368); limits: his (the 5 mm tool gate)
[[diagnostic]]
id = "arm.path_tracking"
diagnostic = "stock.path_accuracy"
title = "path tracking error"
part = "arm"
window_s = 60
[diagnostic.config]
tolerance_mm = 5.0

# moves end without overshoot, within their time
# from: his (Projects/BAM Robotics/BAM/FRDPARRC/DP Waste/Sorting Machine/MRF-in-a-box/Arm Control/bam_core/Acceptance Tests.md:21); limits: none (settle band = the arm's RP once measured)
[[diagnostic]]
id = "arm.overshoot"
diagnostic = "stock.step_response"
title = "overshoot and settle"
part = "arm"
window_s = 60

# a trajectory finishes when planned
# from: his (Projects/BAM Robotics/BAM/FRDPARRC/DP Waste/Sorting Machine/MRF-in-a-box/Arm Control/bam_brain/MDP Agent/Action Client/It should have arm indepdent diagonistics measures.md:4 (FR-038)); limits: none
[[diagnostic]]
id = "arm.completion_time"
diagnostic = "stock.agreement"
title = "completion time accuracy"
part = "arm"
window_s = 60

# the feedback torque needed to stay still
# from: his (Projects/BAM Robotics/BAM/FRDPARRC/DP Waste/Sorting Machine/MRF-in-a-box/Arm Control/bam_core/Acceptance Tests.md:35); limits: none
[[diagnostic]]
id = "arm.hold_effort"
diagnostic = "stock.feedback_share"
title = "hold effort under gravity compensation"
part = "arm"
window_s = 60
[diagnostic.config]
normalize = false

# tool pose vs camera / tags, re-measured in service (ISO 9283 drift dAP)
# from: his (Projects/BAM Robotics/BAM/FRDPARRC/DP Waste/Sorting Machine/MRF-in-a-box/Arm Control/bam_core/Acceptance Tests.md:36); limits: proposed (inside the 5 mm tool gate)
[[diagnostic]]
id = "arm.calibration_drift"
diagnostic = "stock.marker_drift"
title = "calibration drift"
part = "arm"
window_s = 60
[diagnostic.config]
space = "mm"
limits = { warn_high = 2.0, error_high = 5.0 }

# the arm's own verdict from its joints (spider rule)
# from: his (World Model/Chunks & Concepts/C - Diagnostics Record (What We Learned Since ROS DiagnosticStatus).md (Zach in chat, 2026-10-22)); limits: his (the spider rule)
[[diagnostic]]
id = "arm.joints"
diagnostic = "stock.rollup"
title = "joint rollup"
part = "arm"
window_s = 60
[diagnostic.config]
title = "joints"
