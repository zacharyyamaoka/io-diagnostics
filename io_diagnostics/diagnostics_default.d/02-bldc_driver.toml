# BLDC driver board (moteus c1 / r4.11, ODrive)
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 6 bound here (live: consumers robotdx or both); sim2real-only, not bound: driver.saturation, driver.ripple

[[part]]
type = "bldc_driver"
model_id = ["mjbots-moteus-*", "odrive-*"]

# hard faults (32-50) and watchdog (mode 11) fail; a busy limiter warns
# from: his code (like_keras lk/archive/actuators/moteus_servos/dx/error_info.py, config/default_diagnostics.py:87); limits: his code
[[diagnostic]]
id = "driver.faults"
diagnostic = "stock.fault_codes"
title = "fault and limiter codes"
part = "bldc_driver"
state = "motor"
window_s = 60

# FET/board temperature stays inside its band
# from: his code (like_keras lk/archive/actuators/moteus_servos/config/default_diagnostics.py:76); limits: his code
[[diagnostic]]
id = "driver.board_temp"
diagnostic = "stock.box"
title = "board temperature"
part = "bldc_driver"
state = "motor"
window_s = 60
[diagnostic.config]
max = { warn_high = 60.0, error_high = 70.0 }
mean = { warn_high = 55.0, error_high = 65.0 }

# the supply sags or rises out of band
# from: proposed (bam_rack_twin hardware/board.py PREFLIGHT_VOLTAGE_V); limits: proposed (bam_rack_twin hardware/board.py PREFLIGHT_VOLTAGE_V (30-45 V))
[[diagnostic]]
id = "driver.bus_voltage"
diagnostic = "stock.box"
title = "bus voltage"
part = "bldc_driver"
state = "motor"
window_s = 60
[diagnostic.config]
channel = "v_bus_v"
unit = "V"
min = { error_low = 30.0 }
max = { error_high = 45.0 }
headline = "min"

# the control loop runs at its rate, without gaps
# from: his code (like_keras lk/archive/actuators/moteus_servos/component/v5.py:619); limits: his code
[[diagnostic]]
id = "driver.loop_rate"
diagnostic = "stock.sample_rate"
title = "command / telemetry rate"
part = "bldc_driver"
state = "motor"
window_s = 60
[diagnostic.config]
expected_hz = 50.0

# share of commands with no reply; transport errors
# from: his code (like_keras lk/archive/actuators/moteus_servos/component/v5.py:174); limits: proposed (RobotDx P3 'reply_loss < 1 %' (warn); 10 % fail is proposed)
[[diagnostic]]
id = "driver.link_loss"
diagnostic = "stock.share"
title = "CAN reply loss"
part = "bldc_driver"
state = "motor"
window_s = 60
[diagnostic.config]
better = "lower"
scale = 100.0
unit = "%"
limits = { warn_high = 1.0, error_high = 10.0 }

# Kv, ratio, limits and gains equal the deployment's record
# from: proposed (io-diagnostics expected.py _ratio_checks; acceptance T11); limits: proposed
[[diagnostic]]
id = "driver.config"
diagnostic = "stock.agreement"
title = "config matches expected"
part = "bldc_driver"
state = "motor"
window_s = 60
[diagnostic.config]
mode = "mismatches"
limits = { error_high = 0.0 }
