# Servo (integrated: motor, driver, gearbox, encoder as one joint; a rack station)
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 7 bound here (live: consumers robotdx or both); sim2real-only, not bound: servo.floor, servo.twin_fidelity, servo.torque_fidelity, servo.floor_split, servo.twin_split, servo.rest_offset, servo.twin_fidelity_split, servo.torque_truth_load, servo.feedback_share, servo.coverage, servo.envelope, servo.thermal, servo.warm_cold

[[part]]
type = "servo"
composite = ["servo", "joint", "station"]

# real vs target over a run: the net tracking a tape got
# from: his (Projects/BAM Robotics/DP - Reality as Oracle.md:156); limits: none
[[diagnostic]]
id = "servo.tracking_rms"
diagnostic = "stock.tracking_error"
title = "tracking error RMS"
part = "servo"
window_s = 60
[diagnostic.config]
controlled_only = true

# the worst moment, which an RMS hides
# from: his (Projects/BAM Robotics/DP - Reality as Oracle.md:156); limits: none
[[diagnostic]]
id = "servo.tracking_peak"
diagnostic = "stock.tracking_error"
title = "tracking error p95 / max"
part = "servo"
window_s = 60
[diagnostic.config]
statistic = "p95"
controlled_only = true

# the error left at every stop; encoder side is only partial
# from: his (Projects/BAM Robotics/DP - Reality as Oracle.md:156); limits: agent (bam_rack_twin acceptance.py (agent default, 'Zach to confirm') T4)
[[diagnostic]]
id = "servo.stop_error"
diagnostic = "stock.stop_error"
title = "stop error p90"
part = "servo"
window_s = 60
[diagnostic.config]
limits = { error_high = 3.6 }

# share of holds that end and stay within 1 mrad
# from: his (Projects/BAM Robotics/BAM/FRDPARRC/DP Waste/Sorting Machine/MRF-in-a-box/Arm Control/bam_core/Acceptance Tests.md:35); limits: agent (pidtuna K4 0.8)
[[diagnostic]]
id = "servo.hold_effort"
diagnostic = "stock.share"
title = "hold convergence"
part = "servo"
window_s = 60
[diagnostic.config]
limits = { error_low = 0.8 }

# the board's stored Kv against a measure-only calibration
# from: his (Sources/Daily Notes/Daily Note - Oct 28 2026.md:368); limits: proposed (maxon motor constants tolerance)
[[diagnostic]]
id = "servo.torque_truth_kt"
diagnostic = "stock.kt_consistency"
title = "torque truthfulness: Kt vs calibration"
part = "servo"
window_s = 60

# a <= 60 s in-service routine restores T2 after warm-up or a week
# from: agent (bam_rack_twin/acceptance.py (claude/sim-to-real-motor-models-f1ee43)); limits: agent (bam_rack_twin acceptance.py (agent default, 'Zach to confirm') T10)
[[diagnostic]]
id = "servo.live_reid"
diagnostic = "stock.fidelity_ratio"
title = "live re-identification"
part = "servo"
window_s = 60

# hours of operation between confirmed faults, per unit and per type
# from: his (Sources/Notes/BAM KPIs.md:134 (target 20,000 h at :89-91)); limits: his (Sources/Notes/BAM KPIs.md:89-91 (Small / Large Servo MTTF 20,000 hrs))
[[diagnostic]]
id = "servo.mttf"
diagnostic = "stock.event_interval"
title = "servo mean time to failure"
part = "servo"
window_s = 60
[diagnostic.config]
codes = ["fault"]
limits = { error_low = 20000.0 }
