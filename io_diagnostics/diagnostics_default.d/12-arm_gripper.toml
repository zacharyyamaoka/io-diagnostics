# Arm + gripper (composite): the pick
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 5 bound here (live: consumers robotdx or both)

[[part]]
type = "arm_gripper"
composite = ["arm_gripper", "pick", "picker"]

# grasp success x picks per minute, across the bench
# from: his (Sources/Daily Notes/Daily Note - Oct 14 2026.md:681); limits: none
[[diagnostic]]
id = "pick.sppm"
diagnostic = "stock.share"
title = "successful picks per minute"
part = "arm_gripper"
window_s = 60
[diagnostic.config]
slice_by = "stream"

# the robot's SPPM over a human's on the same waste stream
# from: his (Sources/Apple Notes/Ok here is my new strategy plan of attack (APPLE NOTE).md:42); limits: proposed (the human's SPPM as the reference)
[[diagnostic]]
id = "pick.vs_human"
diagnostic = "stock.agreement"
title = "SPPM vs a human"
part = "arm_gripper"
window_s = 60
[diagnostic.config]
mode = "ratio"
limits = { error_low = 1.0 }

# pick events per minute (the rate of the pick stream)
# from: his (Sources/Notes/BAM KPIs.md:68 (target 60)); limits: his (Sources/Notes/BAM KPIs.md:68 (PPM 60 = 1 pick/s))
[[diagnostic]]
id = "pick.rate"
diagnostic = "stock.sample_rate"
title = "picks per minute"
part = "arm_gripper"
window_s = 60
[diagnostic.config]
expected_hz = 1.0

# operating time between human interventions
# from: his (Sources/Apple Notes/Get $1 (APPLE NOTE).md:24); limits: none
[[diagnostic]]
id = "pick.mtti"
diagnostic = "stock.event_interval"
title = "mean time till intervention"
part = "arm_gripper"
window_s = 60
[diagnostic.config]
codes = ["intervention"]
scale = 0.016666666666666666
unit = "min"

# TCP vs the planned grasp pose at closing
# from: his (Sources/Notion Import/Notebook (Jul 2025)/Aruco Challenges.md:21); limits: his (Aruco Challenges: 'within 5mm should be ok for grasping')
[[diagnostic]]
id = "pick.grasp_pose_error"
diagnostic = "stock.stop_error"
title = "tool error at the grasp"
part = "arm_gripper"
window_s = 60
[diagnostic.config]
side = "output"
scale = 1.0
unit = "mm"
limits = { error_high = 5.0 }
