# Camera, hyperspectral
# GENERATED by io_diagnostics/default_diagnostics.py from robotdx/diagnostics/catalog.py + defaults.py; edit those, then
#   uv run --project /home/bam/io-diagnostics python -m io_diagnostics.default_diagnostics --write
# The host's default set (stock_diagnostics.py): read when the person has no diagnostics.toml of their own; the entity page's
# drill-in copies the whole set there the first time a value is changed. `limits:` says whose thresholds these are: his /
# his code gate; agent / proposed show as a warning at most, never a fail, until a person sets their own.
# 4 bound here (live: consumers robotdx or both); sim2real-only, not bound: hsi.smile_keystone

[[part]]
type = "camera_hsi"
model_id = ["specim-*", "*-hyperspectral*"]
composite = ["hyperspectral_camera"]

# signal / noise per band on a uniform target
# from: proposed (HISUI (imm.dtu.dk dace96a4.pdf, snippet)); limits: proposed (HISUI SNR > 200 (unverified))
[[diagnostic]]
id = "hsi.snr"
diagnostic = "stock.spectral_quality"
title = "SNR per band"
part = "camera_hsi"
window_s = 60
[diagnostic.config]
snr = { error_low = 200.0 }

# reflectance needs fresh dark and white frames
# from: proposed (plantcv calibrate docs); limits: proposed (a white and dark reference per hour until lighting changes reset it)
[[diagnostic]]
id = "hsi.references"
diagnostic = "stock.staleness"
title = "dark / white reference age"
part = "camera_hsi"
window_s = 60
[diagnostic.config]
valid_for = [["white*", 3600.0], ["dark*", 3600.0]]
default_valid_s = 3600.0
expected = ["white", "dark"]

# known materials read as themselves
# from: proposed (Kruse et al. 1993 (NV5 SpectralAngleMapper docs)); limits: proposed (SAM max_angle 0.1 rad (ENVI default))
[[diagnostic]]
id = "hsi.spectral_angle"
diagnostic = "stock.spectral_angle"
title = "spectral angle vs library"
part = "camera_hsi"
window_s = 60
[diagnostic.config]
limits = { error_high = 0.1 }

# the cube arrives at its rate
# from: proposed (ROS diagnostic_updater); limits: proposed (set expected_hz from the belt's scan speed)
[[diagnostic]]
id = "hsi.frame_rate"
diagnostic = "stock.sample_rate"
title = "line / frame rate"
part = "camera_hsi"
window_s = 60
