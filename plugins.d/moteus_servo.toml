# IO diagnostics plugin: the moteus_servo driver's own diagnostics (fdcanusb CAN-FD adapters, USB 0483:5740,
# and the moteus boards on their bus). Boundary: docs/build-plan-v1.md "Plugin boundary". The host appends one
# verb to `command`:
#   describe | diagnose --device <id> | act --device <id> --action <name> [--node <CAN id>] [--confirm <token>] [--dry-run]
# and reads diagnostics-record/0 JSON lines (contract/record.py) from stdout. Paths are rooted at
# $IO_DIAGNOSTICS_DEVICE_PATH (the device's own row): <row>/can is the bus, <row>/can/<id> each board.
# Run by hand (passive: never opens the port):
#   uv run --project <cwd> --extra hardware python -m moteus_servo.diagnostics diagnose --device 272813EF --passive

name = "moteus_servo"
description = "fdcanusb adapters + moteus boards: ids, identity, firmware vs latest, read-only config, can status, reply loss"

# WHY enabled: plug in the rack and see live what is connected and whether it works (Zach, 2026-10-22). diagnose
# is query-only bus traffic (query frames + console reads, behind the port-holder check and the rack bus lock),
# which the peer sessions sharing the rack approved; every write (reboot, set_id, update_config, calibrate ...) is
# an `act` that the host runs only for a person at a TTY with --confirm, never on a schedule (docs/api-v1.md).
enabled = true

# WHY a group: diagnose takes the rack bus lock (flock LOCK_NB), and so does intel_rgbd's; two runs at once fail
# each other with BusLockHeld. The host queues the group's jobs instead (moteus vs RealSense, and one plugin's
# devices: found live 2026-10-22 17:41).
exclusive = "rack-bus"

# WHY uv run in the driver's own project: moteus and pyserial live in the driver's env, never in io-diagnostics'.
# WHY the worktree path: the plugin lives on bam_ws branch claude/traj-tracking-sim-to-real-a3da60 until it is
# merged; then both paths become /home/bam/bam_ws/src/core/mdp/agent/actuators/moteus_servo.
# The options before the verb are this installation's: the rack inventory (last-known ids per adapter, so a
# silent board is named), the firmware release cache (update check), the rack bus lock, and the period that
# every status promises as expected_period_s (keep it equal to period_s).
command = [
  "uv", "run", "--quiet",
  "--project", "/home/bam/bam_ws/.claude/worktrees/traj-sim2real-rack/src/core/mdp/agent/actuators/moteus_servo",
  "--extra", "hardware",
  "python", "-m", "moteus_servo.diagnostics",
  "--inventory", "/archive/datasets/bam_rig/rack_inventory",
  "--firmware-cache", "/home/bam/.cache/moteus-firmware",
  "--bus-lock", "/home/bam/.cache/rack-commissioning/bus.lock",
  "--expected-period", "300",
  "--loaded-ids", "1",
  "--deployment-record", "/home/bam/bam_ws/.claude/worktrees/traj-sim2real-rack/src/dev/bam_rack_twin/records/one-dof-test-rack/deployment.json",
  "--moteus-tool", "/home/bam/.local/bin/moteus_tool",
]
cwd = "/home/bam/bam_ws/.claude/worktrees/traj-sim2real-rack/src/core/mdp/agent/actuators/moteus_servo"
# WHY --loaded-ids 1: CAN 1's joint has a hard stop and a gravity load, so its calibrate confirm says so.
# WHY --deployment-record: Identify (wiggle) moves a board only when its live servo config equals this record's
# (bam_rack_twin's config interlock), and reads the board's frame (CAN 1 still reports its rotor) from it. Loaded
# boards (CAN 1) wiggle less, and only away from the stop (--loaded-stop-side, default +1: the stop is on the + side).
# WHY an absolute --moteus-tool: the host's PATH may not include ~/.local/bin (pipx's moteus_tool lives there).

# Seconds per call. The plugin bounds its own bus check at 25 s (--timeout) and reports what it measured by
# then. It asks one id per transaction (moteus 1.0.0 never bounds a reply from a real fdcanusb), so every
# absent id of the 1-32 scan costs 50 ms: a dead bus ~1.6 s plus 0.3 s of re-asks per expected board, a healthy
# 3-board bus about 3-6 s (scan, 20 query cycles, config + identity per board, can status). WHY 60 (2026-10-24):
# a probe, or a diagnose whose cached configuration is over 30 min old, adds the whole-config read
# (conf enumerate, up to 20 s), so 25 + 20 s plus uv's start; a run over the limit keeps nothing (measured).
timeout_s = 60
# Seconds per act call, never used by diagnose. WHY 1800: a firmware update backs up the config, downloads,
# flashes, verifies and restores (the driver allows it up to 1800 s); calibration spins the rotor for up to 600 s.
act_timeout_s = 1800

# Seconds between diagnose calls per adapter. WHY 300: while the check runs it holds the rack bus lock, and an
# experiment that finds the lock held refuses to start; rack_inventory already polls every ~180 s.
period_s = 300

matches = ["usb:0483:5740", "by-id:*fdcanusb*"]
