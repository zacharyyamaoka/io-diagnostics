# IO diagnostics plugin: the Computer's own health (CPU, memory, disks, temperatures, GPU, clock, uptime, network,
# USB bandwidth), as statuses on THE host entity. Boundary: docs/build-plan-v1.md "Plugin boundary". The host appends
# one verb to `command`:
#   describe | diagnose --device <host id>
# and reads diagnostics-record/0 JSON lines (contract/record.py) from stdout. Run by hand:
#   uv run --project /home/bam/io-diagnostics/plugins/computer python -m computer_diagnostics diagnose --device host

name = "computer"
description = "the Computer: CPU, memory, disks, temperatures, GPU, clock sync, uptime, network, USB bandwidth (ROS diagnostic_common_diagnostics names)"

# WHY enabled: it is passive and read-only (psutil, sysfs text files, nvidia-smi / timedatectl / chronyc queries),
# opens no /dev node and registers no action, so it can never hold a port or bus the rack needs (Zach, 2026-10-23).
enabled = true

# WHY uv run in its own project: psutil lives in plugins/computer's env, never in io-diagnostics' (the record
# contract stays stdlib-only). {root} rather than {here}, so a copy of this file in another plugins dir still runs.
command = ["uv", "run", "--quiet", "--project", "{root}/plugins/computer", "python", "-m", "computer_diagnostics"]
cwd = "{root}/plugins/computer"

# Seconds per diagnose: uv's start plus a 0.5 s CPU / network sample and two ~25 ms nvidia-smi queries (about 1 s).
timeout_s = 20
# Seconds between diagnose calls. Must equal computer_diagnostics.PERIOD_S: every status promises it as
# expected_period_s, and the host marks a record stale after max(3 x period, 5 s).
period_s = 10

# The host itself (the Computer), never a device: the only declaration a `host` match may make.
matches = ["host"]
