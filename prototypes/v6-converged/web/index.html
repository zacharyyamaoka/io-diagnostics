<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IO diagnostics</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-host" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-port" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M7 11h3M14 11h3"/></symbol>
    <symbol id="i-hub" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/></symbol>
    <symbol id="i-adapter" viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></symbol>
    <symbol id="i-bus" viewBox="0 0 24 24"><path d="M3 17h18M6 17v-6M12 17v-6M18 17v-6"/><circle cx="6" cy="8" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="18" cy="8" r="2"/></symbol>
    <symbol id="i-servo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 4v3M20 12h-3M12 20v-3M4 12h3"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></symbol>
    <symbol id="i-motor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-stream" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
    <symbol id="i-webcam" viewBox="0 0 24 24"><circle cx="12" cy="10" r="8"/><circle cx="12" cy="10" r="3"/><path d="M7 22h10M12 22v-4"/></symbol>
    <symbol id="i-hid" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M8 13h.01M12 13h.01M16 13h.01M7 16h10"/></symbol>
    <symbol id="i-usb" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-io" viewBox="0 0 24 24"><path d="M3 16h18M6 16v-6M12 16v-6M18 16v-6"/><circle cx="6" cy="7.5" r="2" fill="currentColor"/><circle cx="12" cy="7.5" r="2" fill="currentColor"/><circle cx="18" cy="7.5" r="2" fill="currentColor"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="tb-left">Activities</div>
  <div class="tb-clock" id="clock">—</div>
  <div class="tb-right">
    <button class="chip" id="chip" title="IO diagnostics (top-bar chip)"><svg class="ic"><use href="#i-io"/></svg><span id="chip-label">IO</span><span class="chip-caret">▾</span></button>
    <span class="tb-sys"><svg class="ic"><use href="#i-hub"/></svg>⏻</span>
  </div>
  <div class="chip-pop" id="chip-pop" hidden></div>
</header>

<main class="window">
  <div class="toolbar">
    <div class="seg" id="views">
      <button data-view="tree">Tree</button><button data-view="table">Table</button><button data-view="activity">Activity</button>
    </div>
    <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="search" placeholder="Search entities, ids, ports…" autocomplete="off"></label>
    <div class="spacer"></div>
    <span class="tb-label">Scenario</span>
    <div class="seg" id="frames"></div>
    <div class="seg small" id="speeds" title="Replay speed of the scenario clock">
      <button data-speed="1">1×</button><button data-speed="10">10×</button><button data-speed="60">60×</button>
    </div>
    <button class="ghost" id="restart" title="Restart the scenario clock">↺</button>
  </div>
  <div class="storyline"><span id="story"></span><span class="legend">
    <span class="tag real">real</span><span class="tag recorded">recorded</span><span class="tag reported">reported</span><span class="tag simulated">simulated</span>
  </span></div>
  <div class="main" id="main">
    <section class="left" id="left"></section>
    <aside class="detail" id="detail"></aside>
  </div>
  <footer class="statusbar">
    <span id="lastmsg">—</span>
    <div class="strip mini" id="host-strip"></div>
    <span class="sb-note">passive only · nothing here opens a CAN adapter or a camera · buttons never execute</span>
  </footer>
</main>

<div class="modal-back" id="modal" hidden></div>
<script src="app.js"></script>
</body>
</html>
