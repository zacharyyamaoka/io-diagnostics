[project]
name = "io-diagnostics"
version = "0.0.1"
description = "IO diagnostics: one host that shows every plugged sensor, actuator and bus (OS skeleton + driver plugins) as one tree"
requires-python = ">=3.12"
dependencies = []

# WHY numpy is an extra, not a dependency: the host, the record contract and robotdx.diagnostics' core / registry / record are
# stdlib-only (Zach's "zero or one runtime dep" rule for cores); only the stock diagnostics' arithmetic needs numpy. Without it the
# host still starts, the registry still lists every diagnostic, and each configured one reports not_run with the reason
# (robotdx/diagnostics/_numpy.py): uv run --project /home/bam/io-diagnostics --extra diagnostics io-diagnostics serve
# WHY Pillow in the same extra (Codex audit 2026-11-04 r3, gap 2): the configured camera driver (intel_rgbd) writes its frames as JPEG,
# which neither the stdlib nor numpy decodes; Pillow is the stock decoder (the driver encodes with it, and the Stable channel's
# /usr/bin/python3 has it as python3-pil). Without it a JPEG frame is not_run with NoDecoder, as without numpy.
[project.optional-dependencies]
# WHY sim2real in the same extra (2026-11-10, Zach, "Sim2Real as a Pure Library on robot_msgs" step 4): the stock checks that are also the
# servo gates (floor, tracking and stop error, model error, fidelity ratio, T2's split) and the coverage check's binning call sim2real.metrics,
# so the formula is written once; robotdx/diagnostics/_sim2real.py imports it on first use, so without the extra the host still starts
# WHY robot-metrics in the same extra (2026-11-17, Zach: "a diagnostic = a metric + a threshold"; docs/peps/0004): the stock checks robot_metrics
# v0 computes (tracking error, stop error, the limiter shares) take their metric from it, robotdx/diagnostics/_robot_metrics.py on first use
diagnostics = ["numpy>=1.26", "Pillow>=10", "sim2real", "robot-metrics"]

[project.scripts]
# The one command (serve | tray | once --json): uv run --project /home/bam/io-diagnostics io-diagnostics serve
io-diagnostics = "io_diagnostics.cli:main"

# WHY a build backend: uv installs [project.scripts] only for a packaged project. Editable, so the checkout IS the
# code that runs; the record contract and the passive layer ship beside the host as top-level packages.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["io_diagnostics", "contract", "io_facts", "robotdx"]

[dependency-groups]
# WHY numpy in dev too: the tests (tests/diagnostics) and the page suites run the stock diagnostics; the wheel's runtime stays
# stdlib-only, and the no-numpy path is proven with uv run --isolated --no-dev (tests/diagnostics/test_without_numpy.py)
dev = ["pytest>=8", "numpy>=1.26", "Pillow>=10", "sim2real", "robot-metrics"]
# Lane C interop (io_diagnostics/interop): foxglove-sdk serves /diagnostics to Lichtblick/Foxglove, rosbags writes
# ROS 2 CDR + the ros2msg schema, websockets is the stock client in tests. A group, so the record contract stays
# stdlib-only: uv run --project /home/bam/io-diagnostics --group dev --group interop pytest ...
interop = [
    "foxglove-sdk>=0.30",
    "rosbags>=0.11",
    "websockets>=14",
]
# V4 (registry contract) uses pytest's own plugin manager, pluggy, as its stock plugin system.
v4 = ["pluggy>=1.5"]

[tool.uv.sources]
# WHY an absolute path, editable (sim2real's own pattern for robot_msgs): the same from the main checkout and every lane under
# io-diagnostics-lanes/, and sim2real's main checkout IS the code that runs
sim2real = { path = "/home/bam/sim2real", editable = true }
# WHY the same pattern (absolute, editable): robot_metrics' main checkout IS the code that runs, from main and from every lane
robot-metrics = { path = "/home/bam/robot_metrics", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
